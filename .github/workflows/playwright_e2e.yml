name: Playwright e2e

# Storyboard v59 client e2e gate — proper-fix Phase 1.3 (spec §19.2 single-location).
# LDs: MANDATORY_E2E_GATE_V1 (CRITICAL), CI_PLAYWRIGHT_ON_COMMIT_V1 (HIGH).
#
# Per-session inclusion: this workflow runs the proper-fix protection suite
# AND each downstream session's smoke spec. Currently includes:
#   - `Production/tools/storyboard-v2/e2e/s5_5ce_proper_fix.spec.ts` (13 tests
#     — protects the 5 R-bugs from PR #1 + +NewEvent flow)
#   - `Production/tools/storyboard-v2/e2e/s5_5f_smoke.spec.ts` (18 tests —
#     S5.5f F3-F17 distributed across Phase B-F per spec §19.2/§19.6)
#   - `Production/tools/storyboard-v2/e2e/s5_5g_smoke.spec.ts` (S5.5g G3-G13
#     functional behavior gates per spec §19.2.1 canonical numbering)
#   - `e2e/storyboard-v59-bg-scope-sync.spec.ts` (V59 gap-fix Phase E —
#     already fixture-ready, written against Event_e2e_fixture)
#   - `e2e/storyboard-v59-display-order-empty.spec.ts` (V59 gap-fix Phase E —
#     same; fixture-native)
# Future sessions APPEND their target file to the `npx playwright test ...`
# step below — never replace, never glob (a glob would silently include the
# deferred existing scaffold which requires fuller fixture data). Per
# §19.6.1 maintainability trigger: when count exceeds 15, migrate to a
# Playwright project/tag-based grouping in playwright.config.ts. Current
# count after 2026-05-25 CI inclusion sprint = 26 (24 prior + 2 new:
# rollback / smoke). EXCEEDS 15 threshold — Playwright project/tag-based
# grouping migration is deferred (tracked as prod_blockers). Current explicit
# list is still serviceable and fully auditable.
#   - rollback: auto-skips in CI because Production/Event_1/storyboard_v58_prod.html
#     is not in the checkout; the built-in test.skip(!v58_present) guard fires.
#     Added to CI so the spec is compiled + imported every run (catches type errors).
#   - smoke: fixture-compatible after 3 fixes: (1) Event_1 regex → fixture-agnostic,
#     (2) cropper-modal → modal-cropper, (3) cropper-close → modal-close-cropper.
#     Library seeded by global-setup.ts (1 PNG in beat_generator_stills/sources/).
# DEFERRED specs (behavioral-parity / touchpoint-a) reference Event_1 beats 04-06
# that Event_e2e_fixture does not provide — tracked as SPEC_BLOCKED_ON_FIXTURE
# activity log rows, NOT silently mocked (Rule 19).

on:
  push:
    branches: [main, claude/*, feature/*]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest  # Cursor v11: cheaper than macos-latest; Chromium runs fine on Ubuntu.
    timeout-minutes: 30
    env:
      # Spec §19.5 + counter Q2 — Directus secrets injected from GitHub Actions
      # secrets (set via `gh secret set` or repo Settings → Secrets and variables).
      DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
      DIRECTUS_ADMIN_EMAIL: ${{ secrets.DIRECTUS_ADMIN_EMAIL }}
      DIRECTUS_ADMIN_PASSWORD: ${{ secrets.DIRECTUS_ADMIN_PASSWORD }}
      DIRECTUS_EMAIL: ${{ secrets.DIRECTUS_ADMIN_EMAIL }}
      DIRECTUS_PASSWORD: ${{ secrets.DIRECTUS_ADMIN_PASSWORD }}
      # Optional API keys — server boots in degraded mode if absent; tests that
      # exercise vendor APIs (none in proper-fix) are out of scope here.
      WAVESPEED_API_KEY: ${{ secrets.WAVESPEED_API_KEY }}
      BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Fail-fast secrets preflight (counter Q2)
        # Hard-fail before webServer.command spawns production_server.py if
        # core Directus secrets are unset. Prevents silent-degraded-mode runs
        # that produce false-RED tests for non-product reasons.
        run: |
          if [ -z "$DIRECTUS_URL" ] || [ -z "$DIRECTUS_ADMIN_EMAIL" ] || [ -z "$DIRECTUS_ADMIN_PASSWORD" ]; then
            echo "::error::Required Directus secrets are not set."
            echo "::error::Set DIRECTUS_URL, DIRECTUS_ADMIN_EMAIL, DIRECTUS_ADMIN_PASSWORD via Repo Settings → Secrets and variables → Actions, or via:"
            echo "::error::  gh secret set DIRECTUS_URL --body 'https://directus-production-3460.up.railway.app'"
            echo "::error::  gh secret set DIRECTUS_ADMIN_EMAIL --body '<kim email>'"
            echo "::error::  gh secret set DIRECTUS_ADMIN_PASSWORD --body '<password>'"
            exit 1
          fi
          echo "Secrets preflight OK"

      - name: Install Python deps
        # V59 architectural-fix (Wave 1, F-CI-001 / LD PRODUCTION_TOOLING_REQUIREMENTS_TXT_V1):
        # canonical dep list lives in Production/tools/requirements.txt. New
        # runtime deps go into the file, never inline here.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r Production/tools/requirements.txt

      - name: Install client deps
        working-directory: Production/tools/storyboard-v2
        run: npm ci

      - name: Build dist
        working-directory: Production/tools/storyboard-v2
        run: npm run build

      - name: Install Playwright browsers
        working-directory: Production/tools/storyboard-v2
        run: npx playwright install --with-deps chromium

      - name: Sidecar TypeError regression (AF.3.1 / F-SVR-001)
        # Standalone unit test for _write_sidecar_L_json display_order=int
        # regression. Runs before Playwright so a Python-side regression
        # surfaces independently of e2e flake. Wave 1 architectural-fix.
        run: python3 Production/tools/tests/test_sidecar_display_order_int.py

      - name: DISPLAY_ORDER_STRICT_V2 defense-in-depth (C-10 — TVMC-K4.1 Pytest)
        # Pytest gate per spec §11.1 TVMC-K4.1: StateManager.mutate_state
        # must prune partition.beats to be a subset of partition.display_order
        # whenever display_order is a present LIST. Idempotent on every
        # mutate_state call; isinstance-guard skips legacy int display_order
        # (pre-v3 fixtures). Closes the K4 asymmetry (mutate_video_state
        # always pruned, mutate_state never did pre-C-10).
        run: |
          PRODUCTION_SERVER_SINGLE_MACHINE=1 \
            python3 -m unittest -v Production.tools.tests.test_display_order_strict_v2

      - name: Phase B — register_asset R2 fields signature (DS-2 strict TDD)
        # Phase B Step 5 per V59_PRODUCTION_PIPELINE_STREAM_BF_SPEC_v1 §4.2.
        # register_asset() must accept cdn_url, manifest_published_at,
        # codec_recipe_hash as keyword-only kwargs and persist them in the
        # POSTed prod_assets payload. Mock-based; offline; no Directus side-effects.
        run: |
          PRODUCTION_SERVER_SINGLE_MACHINE=1 \
            python3 -m unittest -v Production.tools.tests.test_register_asset

      - name: Phase B — verify_app_hash_encoding R3 gate (DS-2 strict TDD)
        # Phase B Step 6 per V59_PRODUCTION_PIPELINE_STREAM_BF_SPEC_v1 §4.2 + §3.3.
        # verify_app_hash_encoding() refuses to advance r2_atomic_publish if any
        # digestStringAsync call uses CryptoEncoding.Base64 OUTPUT encoding (which
        # would invalidate the R3 single-hex-hash strategy). Synthetic .ts fixtures
        # in temp dirs make the gate testable offline (no app repo dependency).
        run: |
          PRODUCTION_SERVER_SINGLE_MACHINE=1 \
            python3 -m unittest -v Production.lib.tests.test_release_gates

      - name: Phase C — assemble_module 10-step pipeline (DS-2 strict TDD)
        # Phase C per V59_PRODUCTION_PIPELINE_STREAM_BF_SPEC_v1 §4.3 + §3.2 (R2
        # 10-step pipeline) + §3.4 (R4 Step 1.5 audio parity + bitrate gate) +
        # ASSEMBLE_MODULE_CONTRACT.md (7 declared output artifacts). Mock-based;
        # patches subprocess for ffprobe/ffmpeg and register_asset for Directus.
        # Runs offline; no real ffmpeg/ffprobe/network required.
        run: |
          PRODUCTION_SERVER_SINGLE_MACHINE=1 \
            python3 -m unittest -v Production.tools.tests.test_assemble_module

      - name: Scrambled-state SCR.1+SCR.2 (C-7.6 — READ-ONLY against Event_1)
        # Pytest gates from spec §11.2 + Kim's pre-C-9 addendum 2026-05-06.
        # SCR.1: scope_router.resolve doesn't crash on Event_1 stranded state.
        # SCR.2: _handle_beat_update_text on beat_05 (Guide Bird speaker)
        #        — currently expectedFailure (architectural gap surfaced
        #          pre-salvage; awaiting Kim's authorization on whether
        #          to add canonicalize-on-touch to update_partition).
        # CI runs SKIP these tests because Event_1's actual state.json lives
        # in Kim's Dropbox tree (not in this checkout). Tests execute when
        # the file is reachable (Kim's local runs). Read-only invariant
        # enforced via sha256 pre/post check in tearDownClass.
        run: |
          PRODUCTION_SERVER_SINGLE_MACHINE=1 \
            python3 -m unittest -v Production.tools.tests.test_scope_router_scrambled

      - name: F-REGEN-AUDIO-001 — body-key contract (DS-2 strict TDD)
        # prod_blockers id=124 closure. Server _handle_beat_regenerate_audio
        # must accept the v59 client's `{beat_id: ...}` body shape (per
        # StoryboardTab.tsx:192) — back-compat fallback to legacy `{beat: ...}`.
        # Mock-based; offline; no Directus or ElevenLabs side-effects.
        run: |
          PRODUCTION_SERVER_SINGLE_MACHINE=1 \
            python3 -m unittest -v Production.tools.tests.test_handle_beat_regenerate_audio_body_key

      # ----------------------------------------------------------------
      # MUTATION_CHANNEL_INVARIANT_V1 grep gate (Wave 1 architectural-fix
      # spec §5 Phase 3.4 + Cursor R5 mandatory enforcement).
      #
      # All client-side state mutations MUST flow through pathappPatch
      # (or loadEvent for event_load — which uses apiPostRaw to skip the
      # M1 snapshot intentionally). Raw fetch to mutation endpoints
      # (URL-literal or via MUTATION_ENDPOINTS constant) outside src/api/
      # is a violation. The exclusion of src/api/ from the search lets
      # pathappPatch + loadEvent legitimately use MUTATION_ENDPOINTS
      # internally; everything else routes through them.
      #
      # KNOWN EXCLUSIONS — pre-existing event_load raw-fetch sites
      # incidentally surfaced by Wave 1 grep, tracked as Wave 3 follow-up:
      #   - src/components/ProjectSelector.tsx (2 instances) — blocker #50
      #   - src/components/EventSelector.tsx (1)              — blocker #52
      #   - src/components/ProductionMapTab.tsx (1)           — blocker #53
      # Per spec §10 / Cursor R6 these are NOT fixed in this Wave 1
      # session. The strict variant below surfaces them as a warning
      # every CI run so they remain visible until Wave 3 conversions
      # land. event_load semantics (event swap; no snapshot) mean the
      # right helper for those sites is loadEvent (already in src/api/),
      # not pathappPatch.
      # ----------------------------------------------------------------

      - name: Mutation channel invariant (blocking — known exclusions allowed)
        working-directory: Production/tools/storyboard-v2
        run: |
          set -e
          fail=0

          # Grep 1: raw fetch to MUTATION_ENDPOINTS constant in components / state / utils.
          # Excluded sites: 4 pre-existing event_load violations tracked as
          # blockers #50, #52, #53 (Wave 3). New raw-fetch additions trip the gate.
          matches=$(grep -rnE "fetch\(.*MUTATION_ENDPOINTS\." \
            src/components/ src/state/ src/utils/ 2>/dev/null \
            | grep -vE "(ProjectSelector\.tsx|ProductionMapTab\.tsx).*MUTATION_ENDPOINTS\.event_load" \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::MUTATION_CHANNEL_INVARIANT_V1 violation — raw fetch to MUTATION_ENDPOINTS outside src/api/:"
            echo "$matches"
            echo "::error::Fix: route through pathappPatch (state mutations) or loadEvent (event swap) — both in src/api/."
            fail=1
          fi

          # Grep 2: URL-literal stitch_editor mutation calls (preview / bake / job
          # singular). /jobs (list READ) is preserved as legitimate raw fetch.
          matches=$(grep -rnE "fetch\(.*\/api\/stitch_editor\/(preview|bake|job)" \
            src/components/ src/state/ src/utils/ 2>/dev/null \
            | grep -vE "/jobs[^/a-zA-Z]" \
            || true)
          if [ -n "$matches" ]; then
            echo "::error::MUTATION_CHANNEL_INVARIANT_V1 violation — raw fetch to stitch_editor mutation endpoint:"
            echo "$matches"
            fail=1
          fi

          # Grep 3: URL-literal video mutation calls.
          matches=$(grep -rnE "fetch\(.*\/api\/video\/(set_active|create)" \
            src/components/ src/state/ src/utils/ 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::MUTATION_CHANNEL_INVARIANT_V1 violation — raw fetch to video mutation endpoint:"
            echo "$matches"
            fail=1
          fi

          if [ $fail -ne 0 ]; then
            exit 1
          fi
          echo "Mutation channel invariant: PASS (with documented exclusions for blockers #50, #52, #53)"

      - name: Mutation channel invariant — strict (warning surface for tracked exceptions)
        working-directory: Production/tools/storyboard-v2
        continue-on-error: true
        run: |
          # Strict variant — runs the broad MUTATION_ENDPOINTS sweep WITHOUT
          # exclusions so the 4 tracked event_load sites remain visible in CI
          # logs every run. continue-on-error keeps this a warning, not a
          # block. Wave 3 closes by converting those sites to loadEvent and
          # removing both this step and the exclusion in the gate above.
          matches=$(grep -rnE "fetch\(.*MUTATION_ENDPOINTS\." \
            src/components/ src/state/ src/utils/ 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::warning::MUTATION_CHANNEL_INVARIANT_V1 strict — tracked exceptions present (blockers #50/#52/#53 — Wave 3):"
            echo "$matches"
            exit 1
          fi
          echo "Mutation channel invariant strict: PASS (no tracked exceptions)"

      # ----------------------------------------------------------------
      # SCOPE_ROUTER_V1 / BG_HARDCODED_SCOPE_PURGE_V1 AST grep gate
      # (authoring-workflow architecture, spec_v2 §4 + handoff C-1).
      #
      # Bans hardcoded partition lifts in production_server.py:
      #   * `state.setdefault("videos",{}).setdefault("intro"...` (K1, D5)
      #   * direct top-level `state.setdefault("beats", {})` outside
      #     scope_router.py + StateManager (K2)
      #   * literal `arc_number=1, event_id=2, phase="pre"` in handlers (K3)
      #
      # On the C-1 RED-phase commit, this gate trips RED — it pins the
      # contract that C-2..C-4 turn GREEN by removing the hardcodes. CI
      # green is expected by the close of C-4.
      #
      # Allowed surfaces: scope_router.py (the router itself), and the
      # StateManager block in production_server.py around line 1185-1218
      # (the auto-create path inside mutate_video_state that initializes
      # the partition with the role marker — pre-mutator, not in handler
      # code, and therefore exempt by design).
      # ----------------------------------------------------------------

      - name: SCOPE_ROUTER_V1 + BG_HARDCODED_SCOPE_PURGE_V1 hardcode bans (HARD BLOCK)
        # As of C-7.5 the spec §5.1 sibling-handler audit acceptance is met:
        # repository grep returns ZERO hits for K1/D5/K2/K3 hardcode patterns
        # across production_server.py mutation handlers. C-1 surfaced 6 K1/D5
        # sites + 3 K2 sites + 1 K3 site. C-2 through C-7.5 closed each one:
        #   C-2: K1 canonical (12051) + D5 canonical (4083)
        #   C-3: K2 canonical (8996); K7 Guide-Bird literal at write boundary
        #   C-4: K3 canonical (9279)
        #   C-7.5: 5 sibling sites — _handle_animate ×2, _handle_v2_patch._bump
        #          (also reconciled K2 _version legacy bump),
        #          _handle_v2_beat_swap_to_a, _handle_add_options_legacy,
        #          _handle_v2_beat_create
        # Gate flipped from warning-only (continue-on-error: true during
        # C-1 → C-7 RED→GREEN progression) to hard block: any future
        # regression that re-introduces a hardcoded videos.intro lift,
        # top-level state.beats write, or arc_number=1/event_id=2/phase=pre
        # literal will FAIL CI.
        # Multi-line scan via python — single-line grep misses K1 chain
        # wraps across three lines (`state.setdefault("videos", ...)` /
        # `.setdefault("intro"...` / `.setdefault("beats"...`). Python regex
        # with re.DOTALL catches both single- and multi-line forms.
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          src = pathlib.Path("Production/tools/production_server.py").read_text(encoding="utf-8")

          fail = 0

          # K1 + D5 — hardcoded `videos.intro` partition lift outside router /
          # StateManager. Allowed surfaces: scope_router.py (the router itself);
          # StateManager.mutate_video_state auto-create block (~lines 1185-1196)
          # which initializes the partition with the role marker pre-mutator.
          # Detect multi-line setdefault chains.
          k1_re = re.compile(
              r'state\.setdefault\(\s*"videos"\s*,\s*\{\}\s*\)\.setdefault\(\s*"intro"',
              re.DOTALL,
          )
          for m in k1_re.finditer(src):
              # Line of the match start
              line = src[:m.start()].count("\n") + 1
              # Allowlist: StateManager init block
              if 1180 <= line <= 1230:
                  continue
              snippet = src[m.start():m.end() + 60].replace("\n", " ")
              print(f"::error::K1/D5 hardcode at line {line}: {snippet!r}")
              fail = 1

          # K2 — direct top-level state.beats setdefault.
          k2_re = re.compile(r'state\.setdefault\(\s*"beats"')
          for m in k2_re.finditer(src):
              line = src[:m.start()].count("\n") + 1
              snippet = src[m.start():m.end() + 60].replace("\n", " ")
              print(f"::error::K2 top-level state.beats at line {line}: {snippet!r}")
              fail = 1

          # K3 — hardcoded BG segment.
          k3_re = re.compile(r'arc_number=1,\s*event_id=2,\s*phase="pre"')
          for m in k3_re.finditer(src):
              line = src[:m.start()].count("\n") + 1
              snippet = src[m.start():m.end() + 60].replace("\n", " ")
              print(f"::error::K3 hardcoded BG segment at line {line}: {snippet!r}")
              fail = 1

          if fail:
              print(
                  "::error::Authoring-workflow hardcode bans FAILED. Spec §5.1 acceptance "
                  "is post-C-7 grep returns ZERO; any new hardcoded videos.intro / "
                  "top-level state.beats / arc=1/event=2/phase=pre is a regression. "
                  "Route the partition write via scope_router.mutate_partition or "
                  "app.state.mutate_video_state(scope.video_role, ...) instead."
              )
              sys.exit(1)
          print(
              "Authoring-workflow hardcode bans: PASS "
              "(no hardcoded videos.intro / state.beats / BG segment in handlers)"
          )
          PY

      - name: Run Playwright e2e (proper-fix + retroactive + S5.5f + architectural-fix + authoring-workflow scopes)
        working-directory: Production/tools/storyboard-v2
        # Per spec §19.2 / §19.6 (S5.5f) + §19 / §8.9 (retroactive) — APPEND,
        # not replace, not glob. Each session that ships new e2e specs adds
        # its target file(s) to this list. A glob would silently include the
        # deferred existing scaffold (behavioral-parity / touchpoint-a) which
        # requires Event_1 beats 04-06 not present in Event_e2e_fixture.
        # Currently includes:
        #   - s5_5ce_proper_fix (13 tests — 5 R-bugs + +NewEvent flow)
        #   - retroactive_s1..s6 (41 tests — 6 surfaces from PR #2)
        #   - s5_5f_smoke (18 tests — F3-F17 from PR #3)
        #   - architectural_fix (9 tests — Wave 1 mutation channel + sidecar)
        #   - s5_5g_smoke (S5.5g G3-G13 functional behavior gates from PR #5)
        #   - scope_router_red (C-1 RED suite for K1-K8 + D5 prevention claims)
        #   - beat_graft_red (C-1 RED skeleton for /api/beat/graft cornerstone)
        #   - rollback (auto-skips; v58 file absent from checkout)
        #   - smoke (1 test; fixture-compatible after 3 testid/regex fixes)
        run: |
          npx playwright test \
            e2e/s5_5ce_proper_fix.spec.ts \
            e2e/retroactive_s1_beat_lifecycle.spec.ts \
            e2e/retroactive_s2_pathapp_patch.spec.ts \
            e2e/retroactive_s3_storyboard_refresh.spec.ts \
            e2e/retroactive_s4_magic_compositor.spec.ts \
            e2e/retroactive_s5_library_rendering.spec.ts \
            e2e/retroactive_s6_scope_boundary.spec.ts \
            e2e/s5_5f_smoke.spec.ts \
            e2e/architectural_fix.spec.ts \
            e2e/s5_5g_smoke.spec.ts \
            e2e/scope_router_red.spec.ts \
            e2e/beat_graft_red.spec.ts \
            e2e/storyboard-v59-bg-scope-sync.spec.ts \
            e2e/storyboard-v59-display-order-empty.spec.ts \
            e2e/f_bg_001_segment_dropdown_empty_state.spec.ts \
            e2e/f_ambient_001_real_preset_catalog.spec.ts \
            e2e/f_storyboard_001_scope_injection.spec.ts \
            e2e/f_project_001_milestone_scope.spec.ts \
            e2e/f_phase_a_001_routing.spec.ts \
            e2e/f_phase_b_001_files_serve.spec.ts \
            e2e/delay_durability.spec.ts \
            e2e/phase_waveform_playback.spec.ts \
            e2e/layer_b_option_b_bg_session_state.spec.ts \
            e2e/divergence_residuals_6_layer.spec.ts \
            e2e/track-b-ld-coverage.spec.ts \
            e2e/bg_beat_nav_jump.spec.ts \
            e2e/bg_golden_path.spec.ts \
            e2e/rollback.spec.ts \
            e2e/smoke.spec.ts \
            --reporter=line

      # F-STALE-LIPSYNC-UI-001 / LD STORYBOARD_LIPSYNC_BUTTON_FRESHNESS_GATE_V1.
      # Standalone config — spawns its own tiny node http server on :5599
      # so it doesn't share the :5111 production_server with the suite above.
      # Mocks all bootstrap endpoints via page.route(), so no Event_e2e_fixture
      # dependency. Always runs after the main suite to avoid port contention.
      - name: Playwright e2e — stale-lipsync UI gate (separate config)
        working-directory: Production/tools/storyboard-v2
        run: |
          npx playwright test --config=playwright.stale-lipsync.config.ts \
            --reporter=line

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            Production/tools/storyboard-v2/playwright-report/
            Production/tools/storyboard-v2/test-results/
          retention-days: 7
