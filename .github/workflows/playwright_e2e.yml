name: Playwright e2e

# Storyboard v59 client e2e gate — proper-fix Phase 1.3 (spec §19.2 single-location).
# LDs: MANDATORY_E2E_GATE_V1 (CRITICAL), CI_PLAYWRIGHT_ON_COMMIT_V1 (HIGH).
#
# Per-session inclusion: this workflow runs the proper-fix protection suite
# AND each downstream session's smoke spec. Currently includes:
#   - `Production/tools/storyboard-v2/e2e/s5_5ce_proper_fix.spec.ts` (13 tests
#     — protects the 5 R-bugs from PR #1 + +NewEvent flow)
#   - `Production/tools/storyboard-v2/e2e/s5_5f_smoke.spec.ts` (18 tests —
#     S5.5f F3-F17 distributed across Phase B-F per spec §19.2/§19.6)
# Future sessions APPEND their target file to the `npx playwright test ...`
# step below — never replace, never glob (a glob would silently include the
# deferred existing scaffold which requires fuller fixture data).
# The existing scaffold (smoke / behavioral-parity / rollback / touchpoint-a)
# continues to run manually against Kim's Dropbox tree.

on:
  push:
    branches: [main, claude/*, feature/*]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest  # Cursor v11: cheaper than macos-latest; Chromium runs fine on Ubuntu.
    timeout-minutes: 30
    env:
      # Spec §19.5 + counter Q2 — Directus secrets injected from GitHub Actions
      # secrets (set via `gh secret set` or repo Settings → Secrets and variables).
      DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
      DIRECTUS_ADMIN_EMAIL: ${{ secrets.DIRECTUS_ADMIN_EMAIL }}
      DIRECTUS_ADMIN_PASSWORD: ${{ secrets.DIRECTUS_ADMIN_PASSWORD }}
      DIRECTUS_EMAIL: ${{ secrets.DIRECTUS_ADMIN_EMAIL }}
      DIRECTUS_PASSWORD: ${{ secrets.DIRECTUS_ADMIN_PASSWORD }}
      # Optional API keys — server boots in degraded mode if absent; tests that
      # exercise vendor APIs (none in proper-fix) are out of scope here.
      WAVESPEED_API_KEY: ${{ secrets.WAVESPEED_API_KEY }}
      BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Fail-fast secrets preflight (counter Q2)
        # Hard-fail before webServer.command spawns production_server.py if
        # core Directus secrets are unset. Prevents silent-degraded-mode runs
        # that produce false-RED tests for non-product reasons.
        run: |
          if [ -z "$DIRECTUS_URL" ] || [ -z "$DIRECTUS_ADMIN_EMAIL" ] || [ -z "$DIRECTUS_ADMIN_PASSWORD" ]; then
            echo "::error::Required Directus secrets are not set."
            echo "::error::Set DIRECTUS_URL, DIRECTUS_ADMIN_EMAIL, DIRECTUS_ADMIN_PASSWORD via Repo Settings → Secrets and variables → Actions, or via:"
            echo "::error::  gh secret set DIRECTUS_URL --body 'https://directus-production-3460.up.railway.app'"
            echo "::error::  gh secret set DIRECTUS_ADMIN_EMAIL --body '<kim email>'"
            echo "::error::  gh secret set DIRECTUS_ADMIN_PASSWORD --body '<password>'"
            exit 1
          fi
          echo "Secrets preflight OK"

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          # production_server.py imports PIL (image thumbs in /api/cr/library) +
          # yaml (scene_registry parse in /api/magic/resolve_bg) + stdlib.
          # No requirements.txt yet — install minimum needed by the test scope.
          # Retroactive coverage v1 (2026-05-04) added pyyaml when S4 magic
          # endpoint tests landed; previous proper-fix scope didn't exercise
          # /api/magic/* so the missing import was invisible until now.
          python3 -m pip install Pillow PyYAML

      - name: Install client deps
        working-directory: Production/tools/storyboard-v2
        run: npm ci

      - name: Build dist
        working-directory: Production/tools/storyboard-v2
        run: npm run build

      - name: Install Playwright browsers
        working-directory: Production/tools/storyboard-v2
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e (proper-fix + retroactive + S5.5f scopes)
        working-directory: Production/tools/storyboard-v2
        # Per spec §19.2 / §19.6 (S5.5f) + §19 / §8.9 (retroactive) — APPEND,
        # not replace, not glob. Each session that ships new e2e specs adds
        # its target file(s) to this list. A glob would silently include the
        # deferred existing scaffold (smoke/behavioral/rollback/touchpoint-a)
        # which requires fuller fixture data.
        # Currently includes:
        #   - s5_5ce_proper_fix (13 tests — 5 R-bugs + +NewEvent flow)
        #   - retroactive_s1..s6 (41 tests — 6 surfaces from PR #2)
        #   - s5_5f_smoke (18 tests — F3-F17 from PR #3)
        run: |
          npx playwright test \
            e2e/s5_5ce_proper_fix.spec.ts \
            e2e/retroactive_s1_beat_lifecycle.spec.ts \
            e2e/retroactive_s2_pathapp_patch.spec.ts \
            e2e/retroactive_s3_storyboard_refresh.spec.ts \
            e2e/retroactive_s4_magic_compositor.spec.ts \
            e2e/retroactive_s5_library_rendering.spec.ts \
            e2e/retroactive_s6_scope_boundary.spec.ts \
            e2e/s5_5f_smoke.spec.ts \
            --reporter=line

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            Production/tools/storyboard-v2/playwright-report/
            Production/tools/storyboard-v2/test-results/
          retention-days: 7
