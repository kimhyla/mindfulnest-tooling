name: Smoke

# Smoke CI — proves the GitHub Actions plumbing is wired end-to-end.
# Runs storyboard-v2 build only (npm ci + npm run build).
# The full Playwright e2e workflow lives in playwright_e2e.yml — added by
# the v59 S5.5c+e proper-fix session per STORYBOARD_V59_S5_5_CE_PROPER_FIX_SPEC_v1.md
# Phase 1.3.

on:
  push:
    branches: [main, claude/*, feature/*]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install client deps
        working-directory: Production/tools/storyboard-v2
        run: npm ci
      - name: Build dist
        working-directory: Production/tools/storyboard-v2
        run: npm run build

  body-key-contract:
    # Counter-B Option B — closes prod_blockers id=140 + LD
    # BODY_KEY_CONTRACT_CI_GREP_GATE_V1. Fails CI when the storyboard-v2
    # client sends a body key the server never reads, OR the server reads a
    # key the client never sends, for any registered MUTATION_ENDPOINT.
    # Tolerates known fossil mismatches via baseline file. Tolerates
    # explicit `# BODY_KEY_ALLOW:` / `// BODY_KEY_ALLOW:` annotations.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python3 -m pip install --quiet pytest
      - name: Run unit tests for the check
        run: python3 -m pytest Production/scripts/tests/test_body_key_contract_check.py -v
      - name: Enforce body-key contract (delta vs baseline)
        run: |
          python3 Production/scripts/body_key_contract_check.py \
            --baseline Production/scripts/body_key_contract_baseline.json
      - name: Enforce endpoint-presence contract
        # LD DROPDOWN_SPEAKER_DURABILITY_FIX_V1 — closes the verification-of-
        # deployment-target gap exposed on 2026-05-14: a client endpoint
        # (/api/beat/update_speaker) was declared in MUTATION_ENDPOINTS but
        # had no matching server route, and the body-key gate did not catch
        # it. This step asserts every MUTATION_ENDPOINTS URL has a server
        # route registered. Symmetric to body-key-contract; same parsers.
        run: |
          python3 -m pytest Production/scripts/tests/test_endpoint_presence_contract.py -v
