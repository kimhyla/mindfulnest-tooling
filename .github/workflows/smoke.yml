name: Smoke

# Smoke CI — proves the GitHub Actions plumbing is wired end-to-end.
# Runs storyboard-v2 build only (npm ci + npm run build).
# The full Playwright e2e workflow lives in playwright_e2e.yml — added by
# the v59 S5.5c+e proper-fix session per STORYBOARD_V59_S5_5_CE_PROPER_FIX_SPEC_v1.md
# Phase 1.3.

on:
  push:
    branches: [main, claude/*, feature/*]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install client deps
        working-directory: Production/tools/storyboard-v2
        run: npm ci
      - name: Build dist
        working-directory: Production/tools/storyboard-v2
        run: npm run build
      - name: Storyboard UI regression guard (LD markers incl. LD-829 Phase A single player)
        run: bash Production/scripts/check_storyboard_critical_features.sh

  body-key-contract:
    # Counter-B Option B — closes prod_blockers id=140 + LD
    # BODY_KEY_CONTRACT_CI_GREP_GATE_V1. Fails CI when the storyboard-v2
    # client sends a body key the server never reads, OR the server reads a
    # key the client never sends, for any registered MUTATION_ENDPOINT.
    # Tolerates known fossil mismatches via baseline file. Tolerates
    # explicit `# BODY_KEY_ALLOW:` / `// BODY_KEY_ALLOW:` annotations.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python3 -m pip install --quiet pytest
      - name: Run unit tests for the check
        run: python3 -m pytest Production/scripts/tests/test_body_key_contract_check.py -v
      - name: Enforce body-key contract (delta vs baseline)
        run: |
          python3 Production/scripts/body_key_contract_check.py \
            --baseline Production/scripts/body_key_contract_baseline.json
      - name: Enforce endpoint-presence contract
        # LD DROPDOWN_SPEAKER_DURABILITY_FIX_V1 — closes the verification-of-
        # deployment-target gap exposed on 2026-05-14: a client endpoint
        # (/api/beat/update_speaker) was declared in MUTATION_ENDPOINTS but
        # had no matching server route, and the body-key gate did not catch
        # it. This step asserts every MUTATION_ENDPOINTS URL has a server
        # route registered. Symmetric to body-key-contract; same parsers.
        run: |
          python3 -m pytest Production/scripts/tests/test_endpoint_presence_contract.py -v

  session-lockin-regression:
    # 2026-05-28 session hardening — stitcher canonical job, magic polyline,
    # Send Out magic-assemblable beats. Static markers + unit tests; fails CI
    # if regressions remove lock-in code paths.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest + Pillow (magic_compositor tests)
        run: python3 -m pip install --quiet pytest Pillow numpy scipy imageio imageio-ffmpeg PyYAML
      - name: Install ffmpeg (O3 intro contract + stitch cache gates)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Stitcher lock-in static markers
        run: python3 Production/scripts/verify_stitcher_lockin_20260528.py
      - name: Session regression unit tests
        working-directory: Production/tools
        run: |
          python3 -m pytest \
            tests/test_stitch_canonical_job.py \
            tests/test_beat_is_assemblable.py \
            tests/test_magic_path_polyline.py \
            tests/test_o3_job_state_reliability.py \
            tests/test_beat_generator_o3_sidecar_contract.py \
            tests/test_o3_stuck_job_recovery.py \
            tests/test_arlo_canonical_registry.py \
            tests/test_intro_export_api_contract.py \
            tests/test_phase_a_single_player.py \
            tests/test_beatgen_omni_restore.py \
            tests/test_heal_avatar_pro_poisoned_prompt.py \
            tests/test_milestone_init_bg_paths_authority_guard.py \
            tests/test_bg_job_truth_gallery.py \
            tests/test_beatgen_store.py \
            tests/test_bg_export_live_beat_order.py \
            tests/test_milestone_scope.py \
            tests/test_milestone_o3_job_busy.py \
            -q
      - name: O3 intro contract shell gate
        run: bash Production/scripts/verify_o3_intro_contract.sh
      - name: Character voice onboarding contract (Layer 1 + Layer 2 roster parity)
        run: bash Production/scripts/verify_character_voice_onboarding_contract.sh
      - name: Deploy-backup beat_generator contract
        run: python3 Production/scripts/verify_deploy_backup_contract.py --beat-generator Production/tools/beat_generator.py

  beatgen-per-event-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python3 -m pip install --quiet pytest
      - name: Beat Gen per-event SQLite contracts
        working-directory: Production/tools
        run: |
          python3 -m pytest \
            tests/test_beatgen_per_event_sqlite.py \
            tests/test_event_load_sidecar_reconcile.py \
            tests/test_sidecar_sqlite_cutover_gate.py \
            tests/test_bg_scope_activation_cold_boot_only.py \
            -q
      - name: Launchagent + startup reconcile markers
        run: |
          bash Production/scripts/verify_production_server_launchagent_durability.sh
          grep -q 'reconcile_event_sidecar_after_milestone_exit' Production/tools/production_server.py
          grep -q 'MN_BEATGEN_DB_PATH' Production/scripts/install_production_server_launchagent.sh
