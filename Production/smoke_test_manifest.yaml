  - { ld: LD-756, symbol: 'trim-out', kind: testid }
  - { ld: LD-755, symbol: 'trim-preview', kind: testid }
  - { ld: LD-755, symbol: 'trim-apply', kind: testid }

  # Silent-failure-class kills (LD-769/775/778) — function names in source TSX
  - { ld: LD-769, symbol: 'safePlay', kind: fn, target: source }
  - { ld: LD-775, symbol: 'awaitPriorPlayWithTimeout', kind: fn, target: source }
  - { ld: LD-778, symbol: 'runMutation', kind: fn, target: source }
  # LD-778 re-shipped 2026-05-17: 'expectField' parameter is the unique
