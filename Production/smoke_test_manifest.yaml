  # ===========================================================================
  # OpenAI gpt-image-1 end-frame vendor swap (LD-730)
  # Cross-thread integration per parent prod_activity_log row 4928 (2026-05-17).
  # Implementation in production_server.py (dispatcher + key parsing) and
